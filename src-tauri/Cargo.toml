[package]
name = "rawhplayer"
version = "3.0.0"
description = "Rawh Player Native Audio Engine"
authors = ["Rawh Audio"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
symphonia = { version = "0.5.4", features = ["all"] }
rustfft = "6.4.1"
parking_lot = "0.12.5"
rodio = { version = "0.19.0", features = ["symphonia-all"] }
reqwest = { version = "0.12", features = ["json"] }
cpal = "0.15"
lofty = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
notify = "7"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
